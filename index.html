<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Match Report · Demo (27 ก.ย. 2026)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f7; --surface:#ffffff; --border:#e4e7ea; --text:#1d2024; --muted:#7f858e; --faint:#f1f3f5; --grid:#eceef1;
  --green:#3b8a73; --green-soft:#a8d4c4; --green-tint:#e5f2ec; --red:#d7322e; --red-tint:#fbe8e7; --orange:#d9770f; --orange-tint:#fcefe0;
  --blue:#2d6fd2; --focus:#2d6fd2;
  --font:'Poppins','IBM Plex Sans Thai',system-ui,-apple-system,'Segoe UI','Noto Sans Thai',Tahoma,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121417; --surface:#1a1d21; --border:#2a2f35; --text:#e7e9ec; --muted:#959ca5; --faint:#22262b; --grid:#272c32;
    --green:#58b596; --green-soft:#2f6b5a; --green-tint:#17302a; --red:#ef5b55; --red-tint:#3a1e1d; --orange:#f0983f; --orange-tint:#3a2a18;
    --blue:#6a9ff0; --focus:#6a9ff0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121417; --surface:#1a1d21; --border:#2a2f35; --text:#e7e9ec; --muted:#959ca5; --faint:#22262b; --grid:#272c32;
  --green:#58b596; --green-soft:#2f6b5a; --green-tint:#17302a; --red:#ef5b55; --red-tint:#3a1e1d; --orange:#f0983f; --orange-tint:#3a2a18;
  --blue:#6a9ff0; --focus:#6a9ff0; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding-left:20px;padding-right:20px}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.bar{display:flex;align-items:center;gap:16px;padding-top:14px;padding-bottom:6px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;font-size:20px;font-weight:600;letter-spacing:-.01em}
.brand .sub{font-size:13px;font-weight:400;color:var(--muted)}
.meta{margin-left:auto;display:flex;gap:14px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.meta b{color:var(--text);font-weight:600;margin-left:4px}
.meta b.pos{color:var(--green)}
.theme{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--muted);cursor:pointer}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;padding:10px 12px 12px;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;font-size:14px}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--text);font-weight:500;border-bottom-color:var(--text)}
.tab.extra{color:var(--green)}
.tab.extra[aria-selected="true"]{border-bottom-color:var(--green);color:var(--green)}
.demo{font-size:12.5px;color:var(--muted);padding-top:12px}
.demo span{display:inline-block;background:var(--orange-tint);color:var(--orange);border-radius:6px;padding:2px 8px;margin-right:8px;font-weight:500}

/* layout */
main{padding-top:18px;padding-bottom:48px}
.sec-h{margin:6px 0 14px}
.sec-h h2{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em}
.sec-h p{margin:2px 0 0;color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.stat .l{font-size:12.5px;color:var(--muted)}
.stat .v{font-size:20px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--muted)}
.stat .v.good{color:var(--green)} .stat .v.bad{color:var(--red)}
.flag{display:inline-block;font-size:11px;font-weight:500;border-radius:5px;padding:1px 6px;background:var(--orange-tint);color:var(--orange);margin-left:6px;vertical-align:2px}
.grid{display:grid;gap:12px;margin-bottom:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
@media (max-width:860px){.g21{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;min-width:0}
.panel h3{margin:0;font-size:15px;font-weight:600}
.panel .ps{margin:2px 0 12px;color:var(--muted);font-size:12.5px}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* bars list */
.brow{margin:10px 0}
.brow .bl{display:flex;justify-content:space-between;font-size:13.5px}
.brow .m{color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:7px;background:var(--faint);border-radius:6px;margin-top:5px;overflow:hidden}
.track i{display:block;height:100%;border-radius:6px}
.split{height:9px;border-radius:6px;overflow:hidden;display:flex;background:var(--faint);margin:6px 0 4px}
.split i{display:block;height:100%}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.kv div{font-size:12px;color:var(--muted)}
.kv b{display:block;font-size:15px;color:var(--text);font-weight:600}

/* charts */
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg .gl{stroke:var(--grid);stroke-width:1}
svg .zero{stroke:var(--muted);stroke-width:1;opacity:.6}
svg .ref{stroke:var(--green);stroke-width:1.2;stroke-dasharray:4 4}
svg .tk{fill:var(--muted);font-size:11.5px;font-family:var(--font)}
svg .vl{fill:var(--text);font-size:11.5px;font-weight:500;font-family:var(--font)}
svg rect.bar{transition:opacity .15s}
svg.dim rect.bar:not(.sel){opacity:.28}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}

/* tables */
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{font-size:11.5px;font-weight:500;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;letter-spacing:.02em}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--text)}
th .arr{font-size:10px;margin-left:3px}
td{padding:9px 10px;border-bottom:1px solid var(--faint);white-space:nowrap}
tr.sel td{background:var(--green-tint)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--faint)}
td.pos{color:var(--green)} td.neg{color:var(--red)}
.pill{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:500}
.pill.pos{background:var(--green-tint);color:var(--green)} .pill.neg{background:var(--red-tint);color:var(--red)}

/* rotation cards */
.rcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.rcard{appearance:none;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;cursor:pointer}
.rcard:hover{border-color:var(--muted)}
.rcard[aria-pressed="true"]{border-color:var(--green);box-shadow:0 0 0 1px var(--green) inset}
.rcard .rt{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.rcard .rs{font-size:22px;font-weight:600;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.rcard .rm{font-size:11.5px;color:var(--muted)}

/* hit grid */
.hgrid td{padding:4px;border:0}
.hgrid th{border:0;text-align:center}
.hgrid th:first-child{text-align:left}
.cell{min-width:64px;border-radius:7px;padding:5px 6px;text-align:center;line-height:1.25;font-size:12.5px;background:var(--faint);color:var(--muted)}
.cell small{display:block;font-size:10.5px;opacity:.8}
.cell.p1{background:var(--green-tint);color:var(--text)}
.cell.p2{background:var(--green-soft);color:var(--text)}
.cell.n1{background:var(--red-tint);color:var(--text)}
.cell.z{background:var(--surface);border:1px solid var(--border);color:var(--text)}
.hgrid td.colsel .cell{outline:2px solid var(--green);outline-offset:-1px}

/* highlights */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{appearance:none;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--surface);border-color:var(--text)}
select{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 10px}
.clips{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.clip{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.thumb{aspect-ratio:16/9;background:var(--faint);position:relative;display:grid;place-items:center}
.thumb svg{width:100%;height:100%;position:absolute;inset:0}
.thumb .play{position:relative;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center}
.clip .cb{padding:9px 11px 11px;display:flex;flex-direction:column;gap:2px;flex:1}
.clip .ct{font-weight:500;font-size:13.5px}
.clip .cs{font-size:12px;color:var(--muted)}
.clip button{margin-top:8px;align-self:flex-start;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:12.5px;cursor:pointer}
.clip button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.reel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 120px)}
.reel ol{margin:8px 0 0;padding-left:20px;max-height:340px;overflow:auto;font-size:13px}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* insights */
.scn{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:12px}
.sc{border-radius:14px;border:1px solid var(--border);background:var(--surface);padding:16px 18px}
.sc.on{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange) inset}
.sc .badge{font-size:12px;font-weight:600;color:var(--orange)}
.sc .badge.off{color:var(--muted)}
.sc h4{margin:4px 0 6px;font-size:15px}
.sc p{margin:6px 0;font-size:13px}
.sc .ev{font-size:12.5px;color:var(--muted)}
.tool{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;align-items:end}
.tool label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.tool select,.tool input{width:100%}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:14px}
.res .stat .v small{font-size:13px;color:var(--muted);font-weight:400;margin-left:6px}
.verdict{margin-top:12px;font-size:13.5px;padding:10px 12px;border-radius:10px;background:var(--faint)}
.pcard{margin-top:12px;border-top:1px solid var(--border);padding-top:12px}
.pcard h4{margin:0 0 8px;font-size:15px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function vbar(o){

  if(o.ref!=null){ s+='<line x1="'+l+'" x2="'+(W-r)+'" y1="'+y(o.ref)+'" y2="'+y(o.ref)+'" class="ref"/>'; }

  });

function gbar(o){
  var W=560,H=o.h||250,l=44,r=12,t=18,b=(o.vl&&o.min<0)?46:30,pw=W-l-r,ph=H-t-b;
  var y=function(v){return t+(o.max-v)/(o.max-o.min)*ph;};
  var band=pw/o.cats.length, n=o.series.length, gw=band*0.72, bw=gw/n;
  var s='<svg viewBox="0 0 '+W+' '+H+'" class="chart" role="img" aria-label="'+(o.label||'')+'">';
  o.ticks.forEach(function(tv){ s+='<line x1="'+l+'" x2="'+(W-r)+'" y1="'+y(tv)+'" y2="'+y(tv)+'" class="'+(tv===0?'zero':'gl')+'"/><text x="'+(l-8)+'" y="'+(y(tv)+4)+'" text-anchor="end" class="tk">'+(o.ft?o.ft(tv):tv)+'</text>'; });
  o.cats.forEach(function(c,i){
    var gx=l+i*band+(band-gw)/2;
    o.series.forEach(function(se,j){
      var v=se.vals[i], x=gx+j*bw+1.5, w=bw-3, y0=y(Math.max(v,0)), y1=y(Math.min(v,0)), hh=Math.max(y1-y0, v===0?1:1);

function donut(parts,big,sub){
  var R=62,C=2*Math.PI*R,tot=parts.reduce(function(a,p){return a+p.n;},0),off=0;

  s+='</g><text x="85" y="72" text-anchor="middle" class="tk">RATING</text><text x="85" y="96" text-anchor="middle" style="font-size:24px;font-weight:600;fill:var(--text);font-family:var(--font)">'+big+'</text><text x="85" y="114" text-anchor="middle" class="tk">'+sub+'</text></svg>';

}

var TSTATE={};
function table(id,cols,rows,opt){
  opt=opt||{};
  var st=TSTATE[id]||{k:null,d:-1};
  var data=rows.slice();
  if(st.k){ data.sort(function(a,b){ var x=a[st.k],y=b[st.k]; if(x===null||x===undefined) return 1; if(y===null||y===undefined) return -1; if(typeof x==='string') return st.d*x.localeCompare(y,undefined,{numeric:true}); return st.d*(x-y); }); }
  var h='<div class="scroll" data-tbl="'+id+'"><table><thead><tr>'+cols.map(function(c){ var s=opt.sort!==false&&c.k; return '<th'+(s?' class="sort" data-k="'+c.k+'" scope="col" tabindex="0"':' scope="col"')+(c.r?' style="text-align:right"':'')+'>'+c.l+(st.k===c.k?'<span class="arr">'+(st.d>0?'▲':'▼')+'</span>':'')+'</th>'; }).join('')+'</tr></thead><tbody>';
  data.forEach(function(row){ var cls=(opt.sel&&opt.sel(row)?'sel ':'')+(opt.click?'click':''); h+='<tr class="'+cls+'"'+(opt.click?' data-row="'+row[opt.key]+'" tabindex="0"':'')+'>'+cols.map(function(c){ var v=c.f?c.f(row[c.k],row):(row[c.k]===null||row[c.k]===undefined?'—':row[c.k]); var tc=c.tone?c.tone(row[c.k],row):''; return '<td class="'+tc+'"'+(c.r?' style="text-align:right"':'')+'>'+v+'</td>'; }).join('')+'</tr>'; });
  h+='</tbody></table></div>';
  TABLES[id]={cols:cols,rows:rows,opt:opt};
  return h;
}

function rerenderTable(id){ var t=TABLES[id]; var el=document.querySelector('[data-tbl="'+id+'"]'); if(!t||!el) return; var tmp=document.createElement('div'); tmp.innerHTML=table(id,t.cols,t.rows,t.opt); el.replaceWith(tmp.firstChild); }
document.addEventListener('click',function(ev){ var th=ev.target.closest('th.sort'); if(!th) return; var id=th.closest('[data-tbl]').getAttribute('data-tbl'); var k=th.getAttribute('data-k'); var st=TSTATE[id]||{k:null,d:-1}; TSTATE[id]= st.k===k?{k:k,d:-st.d}:{k:k,d:-1}; rerenderTable(id); });

function playerCard(){
  var p=state.player; if(!p) return '<p class="note">แตะแถวผู้เล่นเพื่อดูสรุปรายคน</p>';
  var b=BOX.filter(function(x){return x.p===p;})[0], s=SERVERS.filter(function(x){return x.p===p;})[0], d=DEF.filter(function(x){return x.p===p;})[0];
  var cells=[];
  if(b.ta>0) cells.push(stat('ตี (Attack)',hit(b.hit),b.k+'K · '+b.e+'E · '+b.ta+' TA'+(b.ta<5?' · n น้อย':'')));
  if(s) cells.push(stat('เสิร์ฟ',s.a+'A / '+s.e+'E',s.att+' ครั้ง · ทีมได้ '+s.won+' แต้ม'));
  if(b.pass!=null) cells.push(stat('รับลูกแรก',b.pass.toFixed(2),'reception error '+b.re));
  if(d) cells.push(stat('เกมรับ','dig '+d.d,'dig error '+d.de+' · block touch '+d.bc));
  cells.push(stat('PTS / NET',b.pts+' / '+sgn(b.net),'NET ไม่นับงานรับ-ขุด-เซต'));
  return '<div class="pcard"><h4>การ์ดผู้เล่น '+p+'</h4><div class="pgrid">'+cells.join('')+'</div><div style="margin-top:10px"><button type="button" class="btn primary" data-goclips="'+p+'">ดูคลิปของ '+p+'</button></div></div>';
}

function cmpResult(){
  var el=document.getElementById('cmpRes'); if(!el) return;
  var A=ATT.filter(function(a){return a.p===state.cmpA;})[0], B=ATT.filter(function(a){return a.p===state.cmpB;})[0], m=state.m;
  var adj=function(a){return ((a.k-a.e)+m*TEAM_HIT)/(a.ta+m);};
  var zone=function(n){return n<5?'n < 5 ยังไม่ควรเทียบ':n<10?'n 5–9 ใช้เป็นสมมติฐาน':'n ≥ 10 เทียบได้';};
  var dA=adj(A), dB=adj(B), diff=Math.abs(dA-dB);
  var v=diff<0.05?'หลังถ่วงแล้วต่างกันไม่ถึง .050 จึงยังแยกไม่ออก เก็บข้อมูลเพิ่มอีก 2–3 นัด':(dA>dB?A.p:B.p)+' ดีกว่าหลังถ่วง ต่างกัน '+diff.toFixed(3).replace(/^0/,'')+' ควรเปิดคลิปยืนยันก่อนสรุป';
  el.innerHTML='<div class="res">'+[A,B].map(function(a,i){var d=i?dB:dA;return stat(a.p+' · ตี '+a.ta+' ครั้ง','<span>'+hit(d)+'</span><small>ดิบ '+hit(a.hit)+'</small>',zone(a.ta));}).join('')+'</div><div class="verdict">'+v+'</div><p class="note">สูตร: (kill − error + ลูกสมมติ × Hit % ทีม) ÷ (จำนวนครั้ง + ลูกสมมติ) · เป็นเทคนิคสถิติทั่วไป ค่าที่ได้คือประมาณการแบบระวังไว้ก่อน</p>';
}

  if(!V[tab]) tab='summary';
  current=tab;
  view.innerHTML=V[tab]();
  view.setAttribute('aria-labelledby','tab-'+tab);
  Array.prototype.forEach.call(tabsEl.children,function(b){b.setAttribute('aria-selected',b.getAttribute('data-tab')===tab?'true':'false');});
  if(tab==='insights') cmpResult();
  if(!keepScroll) window.scrollTo(0,0);
  if(location.hash!=='#'+tab){ try{history.replaceState(null,'','#'+tab);}catch(e){} }
}
tabsEl.addEventListener('click',function(e){var b=e.target.closest('[data-tab]'); if(b) show(b.getAttribute('data-tab'));});
tabsEl.addEventListener('keydown',function(e){ if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft') return; var i=TABS.findIndex(function(t){return t[0]===current;}); i=(i+(e.key==='ArrowRight'?1:-1)+TABS.length)%TABS.length; show(TABS[i][0]); document.getElementById('tab-'+TABS[i][0]).focus(); });

view.addEventListener('click',function(e){
  var t;
  if((t=e.target.closest('[data-rot]'))){ var i=+t.getAttribute('data-rot'); state.rot=state.rot===i?null:i; show('rotations',true); return; }
  if((t=e.target.closest('tr[data-row]'))){ var p=t.getAttribute('data-row'); state.player=state.player===p?null:p; show('players',true); return; }
  if((t=e.target.closest('[data-goclips]'))){ state.hlPlayer=t.getAttribute('data-goclips'); state.hlActions={}; show('highlights'); return; }
  if((t=e.target.closest('[data-act]'))){ var a=t.getAttribute('data-act'); state.hlActions[a]=!state.hlActions[a]; show('highlights',true); return; }
  if((t=e.target.closest('[data-clip]'))){ var id=t.getAttribute('data-clip'), k=state.reel.indexOf(id); if(k>-1) state.reel.splice(k,1); else state.reel.push(id); show('highlights',true); return; }
  if(e.target.id==='clearReel'){ state.reel=[]; show('highlights',true); }
});
view.addEventListener('keydown',function(e){ if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-row]')){ e.preventDefault(); e.target.click(); } });
view.addEventListener('change',function(e){
  if(e.target.id==='hlp'){ state.hlPlayer=e.target.value; show('highlights',true); }
  if(e.target.id==='cmpA'){ state.cmpA=e.target.value; cmpResult(); }
  if(e.target.id==='cmpB'){ state.cmpB=e.target.value; cmpResult(); }
});
view.addEventListener('input',function(e){ if(e.target.id==='mval'){ state.m=+e.target.value; document.getElementById('mout').textContent=state.m; cmpResult(); } });

/* theme */
var root=document.documentElement, themeBtn=document.getElementById('themeBtn');
function isDark(){ var t=root.getAttribute('data-theme'); if(t) return t==='dark'; return window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches; }
function paintBtn(){ themeBtn.textContent=isDark()?'ธีมสว่าง':'ธีมมืด'; }
try{ var saved=localStorage.getItem('match-demo-theme'); if(saved==='dark'||saved==='light') root.setAttribute('data-theme',saved); }catch(e){}
paintBtn();
themeBtn.addEventListener('click',function(){ var next=isDark()?'light':'dark'; root.setAttribute('data-theme',next); try{localStorage.setItem('match-demo-theme',next);}catch(e){} paintBtn(); });

show((location.hash||'#summary').slice(1));
window.addEventListener('hashchange',function(){ var t=location.hash.slice(1); if(t&&t!==current&&V[t]) show(t); });
})();
</script>
</body>
</html>
